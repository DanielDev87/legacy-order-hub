name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, SAST y pruebas
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Estilo (black)
        run: black --check .
      - name: Linter (flake8)
        run: flake8 .
      - name: SAST (bandit)
        run: bandit -r apps common config -c pyproject.toml
      - name: Pruebas con cobertura mínima del 80%
        run: |
          coverage run manage.py test
          coverage report --fail-under=80

  docker:
    name: Build de imagen Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: legacy-order-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    name: Validar manifiestos de Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Validar k8s/
        run: |
          for d in k8s k8s/monitoring k8s/canary; do
            kubectl kustomize "$d" | ./kubeconform -strict -summary -ignore-missing-schemas
          done
