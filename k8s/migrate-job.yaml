# Ejecuta las migraciones una sola vez (los pods web arrancan con RUN_MIGRATIONS=false).
apiVersion: batch/v1
kind: Job
metadata:
  name: orderhub-migrate
  namespace: orderhub
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: legacy-order-hub:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RUN_MIGRATIONS
              value: "true"
          envFrom:
            - configMapRef:
                name: orderhub-config
            - secretRef:
                name: orderhub-secret
          command: ["python", "manage.py", "check", "--database", "default"]
